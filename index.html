<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Old FreeFire App</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

.screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Logo Screen */
#logoScreen {
    background: #000;
    opacity: 0;
    animation: fadeIn 1s forwards;
}

#logoScreen img {
    width: 180px;
    max-width: 35vw;
    animation: smallZoom 2s infinite alternate;
}

/* Loading Screen */
#loadingScreen {
    display: none;
    opacity: 0;
    background: #000;
}

#loadingImage {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Activation */
#activationScreen {
    display: none;
    background: rgba(0,0,0,0.75);
}

.activationBox {
    width: min(430px, 85%);
    padding: 28px;
    border-radius: 15px;
    background: #111820;
    border: 2px solid #ff2020;
    box-shadow: 0 0 30px rgba(255,0,0,.4);
    text-align: center;
    animation: boxIn .5s ease;
}

.activationBox h2 {
    color: #ff2525;
    margin-bottom: 12px;
}

.activationBox p {
    color: white;
    margin-bottom: 18px;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #777;
    background: #050505;
    color: white;
    font-size: 18px;
    text-align: center;
    outline: none;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #ffbd00;
    color: #111;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.97);
}

/* Small Garena logo after activation */
#smallLogo {
    position: absolute;
    width: 85px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
}

@keyframes smallZoom {
    from { transform: scale(.96); }
    to { transform: scale(1.04); }
}

@keyframes boxIn {
    from {
        opacity: 0;
        transform: scale(.85);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes zoomLogo {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.7);
    }
    50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.08);
    }
}

/* Mobile portrait warning */
@media (orientation: portrait) {
    .screen::after {
        content: "Please rotate your phone to landscape";
        position: absolute;
        color: white;
        background: rgba(0,0,0,.9);
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 20px;
        z-index: 999;
    }
}
</style>
</head>

<body>

<!-- RED LOGO SCREEN -->
<div id="logoScreen" class="screen">
    <img src="logo.png" alt="Logo">
</div>

<!-- LOADING SCREEN -->
<div id="loadingScreen" class="screen">

    <img id="loadingImage"
         src="loading.jpg"
         alt="Loading">

    <img id="smallLogo"
         src="logo.png"
         alt="Logo">

</div>

<!-- ACTIVATION SCREEN -->
<div id="activationScreen" class="screen">

    <div class="activationBox">

        <h2>⚠ ACTIVATION REQUIRED</h2>

        <p>
            Please enter your Activation Key
            to continue.
        </p>

        <input
            id="activationKey"
            type="text"
            placeholder="Activation Key"
            maxlength="20">

        <button onclick="activate()">
            CONTINUE
        </button>

        <p id="error"
           style="display:none;color:#ff3030;margin-top:12px;">
            Invalid Activation Key
        </p>

    </div>

</div>

<script>

const logoScreen = document.getElementById("logoScreen");
const loadingScreen = document.getElementById("loadingScreen");
const activationScreen =
      document.getElementById("activationScreen");

const smallLogo = document.getElementById("smallLogo");


// Logo screen → Loading screen
setTimeout(() => {

    logoScreen.style.animation =
        "fadeOut 1s forwards";

    setTimeout(() => {

        logoScreen.style.display = "none";

        loadingScreen.style.display = "flex";

        setTimeout(() => {
            loadingScreen.style.opacity = "1";
        }, 50);

        // Loading screen → Activation
        setTimeout(() => {

            loadingScreen.style.opacity = "0";

            setTimeout(() => {

                loadingScreen.style.display = "none";

                activationScreen.style.display = "flex";

            }, 1000);

        }, 5000);

    }, 1000);

}, 6000);


// Activation
function activate() {

    const key =
        document.getElementById("activationKey").value.trim();

    const error =
        document.getElementById("error");

    if (key === "9900") {

        activationScreen.style.display = "none";

        loadingScreen.style.display = "flex";
        loadingScreen.style.opacity = "1";

        // Small Garena logo zoom
        smallLogo.style.animation =
            "zoomLogo 2s ease forwards";

        setTimeout(() => {
            smallLogo.style.animation = "none";
        }, 2000);

    } else {

        error.style.display = "block";

    }
}

</script>

</body>
  </html>
